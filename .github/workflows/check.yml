name: Check gallery entries

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Full check, including reaching every deck and repository URL -- on a
      # pull request a dead link is exactly what review should catch.
      - name: Validate gallery.json
        run: node scripts/check-gallery.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: guide/package-lock.json

      - name: Build the guide deck
        working-directory: guide
        run: |
          npm ci
          npm run build
